services:
  app: {build: ., ports: ['3000:3000','4000:4000'], env_file: .env.example, depends_on: [mysql, redis]}
  mysql: {image: mysql:8, environment: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: kfc_streams, MYSQL_USER: kfc, MYSQL_PASSWORD: kfc_secret}, volumes: ['./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql','./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql']}
  redis: {image: redis:7-alpine}
