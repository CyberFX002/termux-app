server { listen 80; server_name _; gzip on; location /api/ { proxy_pass http://app:4000; proxy_set_header Host $host; } location /socket.io/ { proxy_pass http://app:4000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; } location / { proxy_pass http://app:3000; } }
